server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monitoring}
    username: ${POSTGRES_USER:monitoring}
    password: ${POSTGRES_PASSWORD:monitoring}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    database-change-log-table: notification_changelog
    database-change-log-lock-table: notification_changelog_lock
  amqp:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

notification:
  grpc:
    server:
      enabled: ${NOTIFICATION_GRPC_SERVER_ENABLED:false}
      port: ${NOTIFICATION_GRPC_PORT:9090}
