<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">Notification service</a>
</header>
<main class="page">
    <h1>Stored notifications</h1>
    <p class="meta">Alerts published by the server catalog appear here after the broker delivers them.</p>
    <p class="message" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p>
    <table th:unless="${#lists.isEmpty(notifications)}">
        <thead>
        <tr>
            <th>When</th>
            <th>Event</th>
            <th>Message</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="note : ${notifications}">
            <td th:text="${#temporals.format(note.createdAt, 'yyyy-MM-dd HH:mm:ss')}">time</td>
            <td th:text="${note.eventId}">event</td>
            <td th:text="${note.message}">message</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
