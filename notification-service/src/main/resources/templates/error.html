<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${status}">Error</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">Notification service</a>
</header>
<main class="page">
    <h1 th:text="${status}">404</h1>
    <p class="error" th:text="${message}">Not found</p>
    <p class="meta" th:if="${path}" th:text="${path}">/missing</p>
    <p class="actions"><a href="/">Back to notifications</a></p>
</main>
</body>
</html>
