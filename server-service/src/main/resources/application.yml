server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:monitoring}
    username: ${POSTGRES_USER:monitoring}
    password: ${POSTGRES_PASSWORD:monitoring}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: qrtz_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.threadCount: 3
  thymeleaf:
    cache: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: monitoring-ui
            client-authentication-method: none
            authorization-grant-type: authorization_code
            scope: openid,profile,roles
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_PUBLIC_ISSUER:http://localhost:8081/realms/monitoring}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://localhost:8081/realms/monitoring}/protocol/openid-connect/token
            user-info-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://localhost:8081/realms/monitoring}/protocol/openid-connect/userinfo
            jwk-set-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://localhost:8081/realms/monitoring}/protocol/openid-connect/certs
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://localhost:8081/realms/monitoring}/protocol/openid-connect/certs
