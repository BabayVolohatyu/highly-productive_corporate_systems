<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Edit server' : 'New server'">Server</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/servers">Server monitoring</a>
</header>
<main class="page">
    <h1 th:text="${editing} ? 'Edit server' : 'New server'">Server</h1>
    <p class="error" th:if="${error}" th:text="${error}">Error</p>
    <form class="form"
          th:action="${editing} ? @{/servers/{id}(id=${serverId})} : @{/servers}"
          th:object="${server}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Hostname
            <input type="text" th:field="*{hostname}" required>
        </label>
        <span class="field-error" th:if="${#fields.hasErrors('hostname')}" th:errors="*{hostname}">error</span>
        <label>IP address
            <input type="text" th:field="*{ipAddress}" required>
        </label>
        <span class="field-error" th:if="${#fields.hasErrors('ipAddress')}" th:errors="*{ipAddress}">error</span>
        <label>Environment
            <select th:field="*{environment}">
                <option th:each="option : ${options.environments}"
                        th:value="${option.code}"
                        th:text="${option.label}">DEV</option>
            </select>
        </label>
        <label>Status
            <select th:field="*{status}">
                <option th:each="option : ${options.statuses}"
                        th:value="${option.code}"
                        th:text="${option.label}">UP</option>
            </select>
        </label>
        <label>Description
            <textarea th:field="*{description}"></textarea>
        </label>
        <p class="actions">
            <button type="submit" th:text="${editing} ? 'Save' : 'Create'">Save</button>
            <a class="secondary" th:href="@{/servers}">Cancel</a>
        </p>
    </form>
</main>
</body>
</html>
