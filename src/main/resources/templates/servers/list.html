<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Servers</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/servers">Server monitoring</a>
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button class="secondary" type="submit">Log out</button>
    </form>
</header>
<main class="page">
    <h1>Monitored servers</h1>
    <p class="meta">
        Signed in as <span th:text="${username}">user</span>
        (<span th:text="${roles}">roles</span>)
    </p>
    <p class="message" th:if="${message}" th:text="${message}">Saved</p>
    <p class="actions">
        <a th:href="@{/servers/new}">Add server</a>
    </p>
    <table>
        <thead>
        <tr>
            <th>Hostname</th>
            <th>IP</th>
            <th>Environment</th>
            <th>Status</th>
            <th>Description</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="server : ${servers}">
            <td th:text="${server.hostname}">host</td>
            <td th:text="${server.ipAddress}">ip</td>
            <td th:text="${server.environment}">env</td>
            <td th:text="${server.status}">status</td>
            <td th:text="${server.description}">description</td>
            <td>
                <div class="row-actions">
                    <a th:href="@{/servers/{id}/edit(id=${server.id})}">Edit</a>
                    <form th:if="${isAdmin}" th:action="@{/servers/{id}/delete(id=${server.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="danger" type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(servers)}">
            <td colspan="6">No servers yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
